name: CI

# Comprobaciones rapidas en cada push (no compila el .exe; eso lo hace release.yml).
on:
  push:
    branches: ['**']
    tags-ignore: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt onnxruntime pytest httpx

      - name: Comprobar que todo el Python compila
        run: python -m compileall -q editfoto tests

      - name: Tests (sin modelos de IA)
        run: python -m pytest tests -q
